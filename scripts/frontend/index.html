<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI — Grounded answers, traced to the page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <div class="brand">
            <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true">
                <path d="M6 8 C6 6 8 5 10 5 H30 C32 5 34 6 34 8 V32 C34 34 32 35 30 35 H10 C8 35 6 34 6 32 Z"
                    fill="none" stroke="currentColor" stroke-width="1.6" />
                <line x1="20" y1="5" x2="20" y2="35" stroke="currentColor" stroke-width="1.2" opacity="0.3" />
                <path d="M24 14 L30 12 L28 18 Z" fill="currentColor" class="brand__spark" />
            </svg>
            <div class="brand__text">
                <h1>GenAI</h1>
                <p>Grounded answers, traced to the page</p>
            </div>
        </div>
        <div class="status" id="status">
            <span class="status__dot" id="status-dot"></span>
            <span id="status-text">Connecting…</span>
        </div>
    </header>

    <main class="thread" id="thread" aria-live="polite">
        <div class="empty-state" id="empty-state">
            <div class="hero-badge">RETRIEVAL-AUGMENTED ASSISTANT</div>
            <h2>Ask questions about Generative AI</h2>
            <p>Search a local knowledge base of 360 research papers and 20 books on machine learning, deep learning, and
                LLMs.</p>

            <div class="sample-suggestions">
                <p class="suggestion-title">Try a sample question:</p>
                <div class="suggestions-grid">
                    <button type="button" class="sample-pill">How should I chunk documents for a RAG system?</button>
                    <button type="button" class="sample-pill">What is the core architecture of Transformers?</button>
                    <button type="button" class="sample-pill">Explain parameter-efficient fine-tuning like
                        LoRA.</button>
                </div>
            </div>
        </div>
    </main>

    <div class="composer-wrapper">
        <form class="composer" id="composer">
            <input type="text" id="message-input" placeholder="Ask question about AI" autocomplete="off"
                maxlength="2000">
            <button type="submit" id="send-button" aria-label="Send question">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" id="send-icon">
                    <path d="M4 12 L20 4 L14 20 L11 13 Z" fill="currentColor" />
                </svg>
            </button>
        </form>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button class="lightbox__close" id="lightbox-close" aria-label="Close image">&times;</button>
        <img class="lightbox__content" id="lightbox-img" src="" alt="Full size preview">
    </div>

    <script src="app.js"></script>
</body>

</html>
